<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#222"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#E05315"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#5528CC"/></marker>
  </defs>

  <!-- residual spine: continuous, nothing sits on it -->
  <line x1="150" y1="34" x2="150" y2="356" stroke="#5528CC" stroke-width="7"
        marker-end="url(#a3)"/>
  <text x="150" y="22" text-anchor="middle" font-size="16" fill="#222">x⁽ˡ⁻¹⁾   [B, L, d_model]</text>
  <text x="150" y="390" text-anchor="middle" font-size="16" fill="#222">x⁽ˡ⁾   [B, L, d_model]</text>

  <!-- branch 1: reads the layer input -->
  <circle cx="150" cy="72" r="6" fill="#5528CC"/>
  <line x1="150" y1="72" x2="232" y2="72" stroke="#222" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="240" y="50" width="130" height="44" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="305" y="78" text-anchor="middle" font-size="17">RMSNorm</text>
  <line x1="370" y1="72" x2="382" y2="72" stroke="#222" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="390" y="50" width="230" height="44" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="505" y="78" text-anchor="middle" font-size="16">Attention (MHA → GQA, §IV)</text>
  <line x1="620" y1="72" x2="632" y2="72" stroke="#222" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="640" y="50" width="100" height="44" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="690" y="78" text-anchor="middle" font-size="17">Wᴼ</text>
  <path d="M740,72 L790,72 L790,142 L172,142" fill="none" stroke="#E05315"
        stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="470" y="134" font-size="14" fill="#E05315">Δ attention</text>
  <circle cx="150" cy="142" r="15" fill="#fff" stroke="#5528CC" stroke-width="3"/>
  <text x="150" y="148" text-anchor="middle" font-size="18" fill="#5528CC">+</text>
  <text x="815" y="62" font-size="16" fill="#5528CC">routes across L</text>
  <text x="815" y="84" font-size="14" fill="#555">(between tokens)</text>

  <!-- branch 2: reads the post-attention state -->
  <circle cx="150" cy="212" r="6" fill="#5528CC"/>
  <line x1="150" y1="212" x2="232" y2="212" stroke="#222" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="240" y="190" width="130" height="44" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="305" y="218" text-anchor="middle" font-size="17">RMSNorm</text>
  <line x1="370" y1="212" x2="382" y2="212" stroke="#222" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="390" y="190" width="230" height="44" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="505" y="218" text-anchor="middle" font-size="17">SwiGLU FFN</text>
  <path d="M620,212 L790,212 L790,282 L172,282" fill="none" stroke="#E05315"
        stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="470" y="274" font-size="14" fill="#E05315">Δ FFN</text>
  <circle cx="150" cy="282" r="15" fill="#fff" stroke="#5528CC" stroke-width="3"/>
  <text x="150" y="288" text-anchor="middle" font-size="18" fill="#5528CC">+</text>
  <text x="815" y="202" font-size="16" fill="#5528CC">processes across d</text>
  <text x="815" y="224" font-size="14" fill="#555">(within a token)</text>
