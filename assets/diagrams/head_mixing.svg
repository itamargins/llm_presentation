<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" font-family="Helvetica Neue, Arial, sans-serif">
  <text x="260" y="16" text-anchor="middle" font-size="14" fill="#222">Concat(head₁ … head₃₂)   [2, 512, 4096]</text>
  <g>
    <rect x="20" y="26" width="60" height="34" fill="#5528CC" fill-opacity="0.85" stroke="#fff"/>
    <rect x="80" y="26" width="60" height="34" fill="#5528CC" fill-opacity="0.70" stroke="#fff"/>
    <rect x="140" y="26" width="60" height="34" fill="#5528CC" fill-opacity="0.55" stroke="#fff"/>
    <rect x="200" y="26" width="60" height="34" fill="#5528CC" fill-opacity="0.40" stroke="#fff"/>
    <rect x="260" y="26" width="60" height="34" fill="#5528CC" fill-opacity="0.85" stroke="#fff"/>
    <rect x="320" y="26" width="60" height="34" fill="#5528CC" fill-opacity="0.70" stroke="#fff"/>
    <rect x="380" y="26" width="60" height="34" fill="#5528CC" fill-opacity="0.55" stroke="#fff"/>
    <rect x="440" y="26" width="60" height="34" fill="#5528CC" fill-opacity="0.40" stroke="#fff"/>
  </g>
  <text x="20" y="76" font-size="12" fill="#555">each slice: d_k = 128</text>

  <text x="260" y="104" text-anchor="middle" font-size="14" fill="#222">residual coordinates a head can reach</text>

  <g transform="translate(45,118)">
    <rect x="0" y="0" width="160" height="160" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <rect x="0" y="0" width="20" height="20" fill="#5528CC" fill-opacity="0.8"/>
    <rect x="20" y="20" width="20" height="20" fill="#5528CC" fill-opacity="0.8"/>
    <rect x="40" y="40" width="20" height="20" fill="#5528CC" fill-opacity="0.8"/>
    <rect x="60" y="60" width="20" height="20" fill="#5528CC" fill-opacity="0.8"/>
    <rect x="80" y="80" width="20" height="20" fill="#5528CC" fill-opacity="0.8"/>
    <rect x="100" y="100" width="20" height="20" fill="#5528CC" fill-opacity="0.8"/>
    <rect x="120" y="120" width="20" height="20" fill="#5528CC" fill-opacity="0.8"/>
    <rect x="140" y="140" width="20" height="20" fill="#5528CC" fill-opacity="0.8"/>
    <text x="80" y="180" text-anchor="middle" font-size="13" fill="#222">without Wᴼ</text>
    <text x="80" y="196" text-anchor="middle" font-size="12" fill="#555">head i → slice i only</text>
  </g>

  <g transform="translate(285,118)">
    <rect x="0" y="0" width="160" height="160" fill="#5528CC" fill-opacity="0.5"
          stroke="#222" stroke-width="1.5"/>
    <g stroke="#fff" stroke-width="1">
      <line x1="20" y1="0" x2="20" y2="160"/><line x1="40" y1="0" x2="40" y2="160"/>
      <line x1="60" y1="0" x2="60" y2="160"/><line x1="80" y1="0" x2="80" y2="160"/>
      <line x1="100" y1="0" x2="100" y2="160"/><line x1="120" y1="0" x2="120" y2="160"/>
      <line x1="140" y1="0" x2="140" y2="160"/>
      <line x1="0" y1="20" x2="160" y2="20"/><line x1="0" y1="40" x2="160" y2="40"/>
      <line x1="0" y1="60" x2="160" y2="60"/><line x1="0" y1="80" x2="160" y2="80"/>
      <line x1="0" y1="100" x2="160" y2="100"/><line x1="0" y1="120" x2="160" y2="120"/>
      <line x1="0" y1="140" x2="160" y2="140"/>
    </g>
    <text x="80" y="180" text-anchor="middle" font-size="13" fill="#E05315">with Wᴼ</text>
    <text x="80" y="196" text-anchor="middle" font-size="12" fill="#555">every head → every coord</text>
  </g>

  <text x="260" y="340" text-anchor="middle" font-size="13" fill="#555">[2, 512, 128] → [2, 512, 4096] → [2, 512, 4096]</text>
</svg>
