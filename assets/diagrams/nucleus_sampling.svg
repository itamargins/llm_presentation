<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow-nucleus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E05315"/>
    </marker>
  </defs>
  <g font-size="18" text-anchor="middle">
    <!-- main column -->
    <g fill="#F2EEFC" stroke="#5528CC" stroke-width="1.5">
      <rect x="10" y="10" width="430" height="58" rx="6"/>
      <rect x="10" y="97" width="430" height="58" rx="6"/>
      <rect x="10" y="184" width="430" height="58" rx="6"/>
      <rect x="10" y="271" width="430" height="58" rx="6"/>
      <rect x="10" y="358" width="430" height="58" rx="6"/>
      <rect x="10" y="445" width="430" height="58" rx="6"/>
      <rect x="10" y="532" width="430" height="58" rx="6"/>
    </g>
    <g fill="#222222">
      <text x="225" y="45">Raw Logits  z&#8348;</text>
      <text x="225" y="132">1. Temperature Scaling  (z&#8348; / T)</text>
      <text x="225" y="219">2. Softmax Distribution  P</text>
      <text x="225" y="306">3. Sort Probabilities Descending</text>
      <text x="225" y="393">4. Truncate Cumulative Sum &#8804; p</text>
      <text x="225" y="480">5. Renormalize Remaining Tokens</text>
      <text x="225" y="567">6. Categorical Sampling</text>
    </g>
    <!-- side box: top-p threshold, merges into step 4 -->
    <g fill="#FBEFE9" stroke="#E05315" stroke-width="1.5">
      <rect x="490" y="358" width="260" height="58" rx="6"/>
    </g>
    <g fill="#222222">
      <text x="620" y="383">Top-p Threshold</text>
      <text x="620" y="405" font-size="15">(e.g., p = 0.9)</text>
    </g>
  </g>
  <g stroke="#E05315" stroke-width="2" marker-end="url(#arrow-nucleus)">
    <line x1="225" y1="68" x2="225" y2="95"/>
    <line x1="225" y1="155" x2="225" y2="182"/>
    <line x1="225" y1="242" x2="225" y2="269"/>
    <line x1="225" y1="329" x2="225" y2="356"/>
    <line x1="225" y1="416" x2="225" y2="443"/>
    <line x1="225" y1="503" x2="225" y2="530"/>
    <line x1="490" y1="387" x2="442" y2="387"/>
  </g>
</svg>
