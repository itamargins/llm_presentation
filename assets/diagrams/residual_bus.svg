<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="b1" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#222"/></marker>
    <marker id="b2" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#E05315"/></marker>
    <marker id="b3" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#5528CC"/></marker>
  </defs>

  <text x="10" y="26" font-size="14" fill="#5528CC">residual stream   [B, L, d_model]</text>
  <line x1="10" y1="62" x2="500" y2="62" stroke="#5528CC" stroke-width="7" marker-end="url(#b3)"/>

  <circle cx="70" cy="62" r="5" fill="#5528CC"/>
  <line x1="70" y1="62" x2="70" y2="106" stroke="#222" stroke-width="2" marker-end="url(#b1)"/>
  <text x="18" y="92" font-size="12" fill="#555">read</text>
  <rect x="40" y="112" width="150" height="46" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" font-size="15">Attention + Wᴼ</text>
  <line x1="165" y1="112" x2="165" y2="80" stroke="#E05315" stroke-width="2.5" marker-end="url(#b2)"/>
  <text x="176" y="104" font-size="12" fill="#E05315">Δx</text>
  <circle cx="165" cy="62" r="13" fill="#fff" stroke="#5528CC" stroke-width="3"/>
  <text x="165" y="68" text-anchor="middle" font-size="16" fill="#5528CC">+</text>

  <circle cx="290" cy="62" r="5" fill="#5528CC"/>
  <line x1="290" y1="62" x2="290" y2="106" stroke="#222" stroke-width="2" marker-end="url(#b1)"/>
  <text x="238" y="92" font-size="12" fill="#555">read</text>
  <rect x="260" y="112" width="150" height="46" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="335" y="140" text-anchor="middle" font-size="15">SwiGLU FFN</text>
  <line x1="385" y1="112" x2="385" y2="80" stroke="#E05315" stroke-width="2.5" marker-end="url(#b2)"/>
  <text x="396" y="104" font-size="12" fill="#E05315">Δx</text>
  <circle cx="385" cy="62" r="13" fill="#fff" stroke="#5528CC" stroke-width="3"/>
  <text x="385" y="68" text-anchor="middle" font-size="16" fill="#5528CC">+</text>

  <text x="10" y="204" font-size="14" fill="#222">read → compute Δx → add. Never overwrite.</text>
  <text x="10" y="230" font-size="14" fill="#E05315">The FFN reads the stream after the attention write.</text>
