</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="section-header" data-style="@import '../design/theme.css';" lang="en-IL" class="section-header" data-marpit-pagination="29" style="--paginate:true;--class:section-header;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h2 id="6-the-context-window">6. The Context Window</h2>
<div class="fig">
<blockquote>
<p>Beyond the buzzword.</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="@import '../design/theme.css';" lang="en-IL" data-marpit-pagination="30" style="--paginate:true;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="context-window">Context Window (<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>C</mi><mtext>max</mtext></msub></mrow><annotation encoding="application/x-tex">C_{\text{max}}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">max</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>)</h3>
<ul>
<li>
<p>The Context Window (or context length, denoted as <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>L</mi></mrow><annotation encoding="application/x-tex">L</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span></span></span></span> or <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span>) is the maximum number of tokens an autoregressive Transformer can process in a single forward pass, retain in its attention mechanism, and use to generate the next token.</p>
</li>
<li>
<p>This includes both the prompt tokens and previously generated tokens simultaneously.</p>
</li>
<li>
<p>Any token beyond this limit must either be truncated, evicted from memory, or handled via specialized long-context mechanisms.</p>
</li>
</ul>
<div class="fig">
<p><img src="../assets/context-window.svg" alt="" style="height:320px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="@import '../design/theme.css';" lang="en-IL" data-marpit-pagination="31" style="--paginate:true;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="how-does-it-affect-us">How does it affect us?</h3>
<ul>
<li>
<p><strong>Compute bottleneck</strong>: Since attention requires <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>L</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(L^2)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">L</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> operations (per head), <strong>when L doubles, the number of operations quadruples</strong>. This mostly has a heavy effect on the prefill phase.</p>
</li>
<li>
<p><strong>Memory bottleneck</strong>: <strong>KV cache memory size grows linearly with L</strong>.</p>
</li>
<li>
<p><strong>Positional Embeddings</strong>: Absolute and Sinusoidal PEs literally didn't have a term for the L+1 position. As for RoPE, the relative distances are within the trained range (e.g. 4,096), so if L &gt; 4,096, the relative distances (and therefore the rotation angles) are out of distribution.<br />
<br /><br />
<br /><br />
<br /><br />
So - how do we expand the context window?</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="section-header" data-style="@import '../design/theme.css';" lang="en-IL" class="section-header" data-marpit-pagination="32" style="--paginate:true;--class:section-header;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h2 id="7-memory-optimization-techniques">7. Memory Optimization Techniques</h2>
<br />
<p>Reduce KV Heads: <strong>MQA / GQA</strong></p>
<p>Hardware/IO Awareness: <strong>FlashAttention</strong></p>
<p>Memory Paging: <strong>PagedAttention</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-style="@import '../design/theme.css';" lang="en-IL" data-marpit-pagination="33" style="--paginate:true;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="multi-query-attention---google-2019-noam-shazeer">Multi-Query Attention - Google, 2019 (Noam Shazeer*)</h3>
<ul>
<li>Uses a <strong>single, shared key for all queries</strong>. Afterwards, attention scores are scaled and softmaxed, multiplied by the values, and concatenated back - same process as MHA.</li>
<li>This means that the shared <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>w</mi><mi>k</mi></msub></mrow><annotation encoding="application/x-tex">w_k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0269em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> is responsible for organizing the shared representation space, where different queries can separate the relationships learned by different heads.</li>
<li><strong>Achieves a 7x speedup in inference time and only 0.3 degradation in perplexity metric (LM benchmark)</strong>.</li>
</ul>
<div class="fig">
<p><img src="../assets/mqa.jpg" alt="" style="width:760px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-style="@import '../design/theme.css';" lang="en-IL" data-marpit-pagination="34" style="--paginate:true;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="grouped-query-attention---google-2023">Grouped-Query Attention - Google, 2023</h3>
<ul>
<li>Defines a <em>sub-group of queries</em> that share keys, controlling the trade-off between speed and quality.<br />
<br /><br />
<br /></li>
</ul>
<div class="fig">
<p><img src="../assets/gqa.jpg" alt="" style="width:760px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-style="@import '../design/theme.css';" lang="en-IL" data-marpit-pagination="35" style="--paginate:true;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="mha-vs-mqa-vs-gqa">MHA vs. MQA vs. GQA</h3>
<div class="fig">
<p><img src="../assets/attn_sbs.jpg" alt="" style="width:760px;" /></p>
</div>
<ul>
<li>GQA is essentially on the spectrum between MQA (if #subgroups = H) and vanilla MHA (if #subgroups = 1).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-style="@import '../design/theme.css';" lang="en-IL" data-marpit-pagination="36" style="--paginate:true;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="mha--mqa--gqa-performance-vs-quality-trade-off">MHA / MQA / GQA: Performance vs. Quality Trade-off</h3>
<div class="fig">
<p><img src="../assets/attn_performance.jpg" alt="" style="height:460px;" /></p>
</div>
<p>Performance: MHA has the best performance, but is the slowest,</p>
<p>MQA is fast but also the worst-performing method,</p>
<p>while <strong>GQA achieves a minor reduction in quality while achieving the same speedup as MQA.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-class="spacious" data-style="@import '../design/theme.css';" lang="en-IL" class="spacious" data-marpit-pagination="37" style="--paginate:true;--class:spacious;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="training-note-converting-mha-to-mqagqa">Training Note: Converting MHA to MQA/GQA</h3>
<ul>
<li><strong>Training with MQA/GQA from scratch is unstable</strong>, so authors proposed training on MHA, then converting to MQA/GQA by mean-pooling K-projections within groups, and finally training for a few steps more.</li>
</ul>
<br />
<ul>
<li><strong>Mean pooling proved (empirically) better</strong> than taking the first key or taking a randomly-selected key from the group.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="@import '../design/theme.css';" lang="en-IL" data-marpit-pagination="38" style="--paginate:true;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="gqa-and-sota">GQA and SOTA</h3>
<div class="fig">
<br />
<br />
<p><img src="../assets/llms_with_gqa.jpg" alt="" style="height:460px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-class="spacious" data-style="@import '../design/theme.css';" lang="en-IL" class="spacious" data-marpit-pagination="39" style="--paginate:true;--class:spacious;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="multi-head-latent-attention---deepseek-ai-2024">Multi-Head Latent Attention - DeepSeek-AI, 2024</h3>
<ul>
<li>MLA as a low-rank compression technique (compressing <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span> and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>V</mi></mrow><annotation encoding="application/x-tex">V</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.2222em;">V</span></span></span></span> into a tiny latent vector <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msubsup><mi>c</mi><mi>t</mi><mrow><mi>K</mi><mi>V</mi></mrow></msubsup></mrow><annotation encoding="application/x-tex">c_t^{KV}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0883em;vertical-align:-0.247em;"></span><span class="mord"><span class="mord mathnormal">c</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8413em;"><span style="top:-2.453em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0715em;">K</span><span class="mord mathnormal mtight" style="margin-right:0.2222em;">V</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.247em;"><span></span></span></span></span></span></span></span></span></span> via joint projection), showing how state-of-the-art architectures compress the cache even further without sacrificing MHA-level representation power.</li>
</ul>
<div class="columns">
<div>
<div class="fig">
<p><img src="../assets/kv_cache.png" alt="" style="height:420px;" /></p>
</div>
</div>
<div>
<div class="fig">
<p><img src="../assets/mla.png" alt="" style="height:420px;" /></p>
</div>
</div>
</div>
<center>
<p><a href="../docs/appendixA_kvCache.md">KV-cache Memory saving examples: Llama-3 70B Benchmark</a></p>
</center>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-style="@import '../design/theme.css';" lang="en-IL" data-marpit-pagination="40" style="--paginate:true;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="paged-attention---uc-berkeley-vllm-project-2023">Paged Attention - UC Berkeley (vLLM Project), 2023</h3>
<ul>
<li>Problem: Traditional KV cache allocation requires contiguous memory blocks in VRAM per request, <strong>leading to severe virtual memory fragmentation</strong> (up to 60-80% memory waste).</li>
<li>Solution: Operates like <strong>virtual memory paging in operating systems</strong>. It splits the KV Cache into fixed-size physical memory blocks (e.g., 16 tokens per block) allocated dynamically via a lookup page table.</li>
<li>Impact: Eliminates memory fragmentation, enabling significantly higher batch sizes on fixed GPU hardware.</li>
</ul>
<div class="fig">
<p><img src="../assets/paged_attention.png" alt="" style="height:420px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-style="@import '../design/theme.css';" lang="en-IL" data-marpit-pagination="41" style="--paginate:true;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="flash-attention-optional">Flash Attention (optional)</h3>
<ul>
<li>The Problem: Storing the intermediate <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi><mo>×</mo><mi>N</mi></mrow><annotation encoding="application/x-tex">N \times N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span> attention matrix <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi></mrow><annotation encoding="application/x-tex">A</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">A</span></span></span></span> in High Bandwidth Memory (HBM) creates an <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msup><mi>N</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(N^2)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> memory footprint and makes attention memory-bandwidth bound rather than compute-bound.</li>
<li>The Solution: FlashAttention uses tiling (online softmax) to compute attention block-by-block inside fast SRAM on the GPU chip without ever writing the massive <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi><mo>×</mo><mi>N</mi></mrow><annotation encoding="application/x-tex">N \times N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span> matrix back to HBM.</li>
<li>The Takeaway: While GQA saves VRAM space, FlashAttention gives you raw wall-clock speedup and exact (non-approximated) attention computation.</li>
</ul>
<div class="fig">
<p><img src="../assets/llm_blocks.png" alt="" style="width:760px;" /></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-class="spacious" data-style="@import '../design/theme.css';" lang="en-IL" class="spacious" data-marpit-pagination="42" style="--paginate:true;--class:spacious;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">

<h3 id="httpshfviewercom---architectures-and-glossary"><a href="https://hfviewer.com/">https://hfviewer.com/</a> - architectures and glossary</h3>

<li>Any model on HuggingFace can be visualized - simply replace the URL.
<ul>
<li>Qwen3.8-27B: <a href="https://hfviewer.com/Qwen/Qwen3.8-27B">https://hfviewer.com/Qwen/Qwen3.8-27B</a></li>
<li>GQA: <a href="https://hfviewer.com/glossary/grouped-query-attention/">https://hfviewer.com/glossary/grouped-query-attention/</a></li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="spacious" data-style="@import '../design/theme.css';" lang="en-IL" class="spacious" data-marpit-pagination="43" style="--paginate:true;--class:spacious;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="summary-what-we-built">Summary: What We Built</h3>
<div class="columns">
<div>
<ul>
<li>We started with Self-Attention and Multi-Head Attention, and built the basic Transformer Block around it, using RMSNorm, residual paths, attention, and SwiGLU.</li>
<li>We stacked these blocks to get an encoder and decoder, wrapped by tokenization and LM layers - the bridges from tokens to the model's internal representation, and vice versa.</li>
<li>We saw how variants of these modules are used in frontier LLMs.</li>
</ul>
</div>
<div>
<div class="columns">
<div>
<p><img src="../assets/transformer.png" alt="" style="height:420px;" /></p>
</div>
<div>
<p><img src="../assets/bert.png" alt="" style="height:420px;" /></p>
</div>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="spacious" data-style="@import '../design/theme.css';" lang="en-IL" class="spacious" data-marpit-pagination="44" style="--paginate:true;--class:spacious;--style:@import '../design/theme.css';;" data-marpit-pagination-total="44">
<h3 id="summary-inference--optimization">Summary: Inference &amp; Optimization</h3>
<div class="columns">
<div>
<ul>
<li>We saw the two distinct phases of LLM Inference: Prefill is compute-bound; Decode is memory-bandwidth-bound.</li>
<li>We understood the limitations these models have, regarding both memory and speed, and saw how contemporary innovation overcame them - KV cache.</li>
<li>And finally, we learned further techniques from active areas of research to optimize the behavior and deployment of these models.</li>
</ul>
<p>The next step is understanding how these models go through further training and tuning that push beyond supervised approaches.</p>
</div>
<div>
<div>
<p><img src="../assets/kv_cache.png" alt="" style="height:250px;" /></p>
</div>
<div>
<p><img src="../assets/paged_attention.png" alt="" style="height:250px;" /></p>
</div>
</div>
</div>
</section>
